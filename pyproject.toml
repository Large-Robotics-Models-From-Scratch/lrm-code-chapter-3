[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lrm-ch03"
version = "0.1.0"
description = "Chapter 3 code for 'Build a Large Robot Model (From Scratch)' (Manning): VLA backbone — SigLIP vision encoder + SmolLM language backbone + multimodal fusion transformer"
requires-python = ">=3.12,<3.14"
license = { text = "Apache-2.0" }
authors = [
    { name = "Krishnam Gupta" },
    { name = "Siddharth Singh" },
    { name = "Vatsal Chanana" },
]
dependencies = [
    "torch>=2.5,<3.0",
    "transformers>=5.0,<6.0",
    "numpy>=1.24,<3.0",
    "pillow>=10,<12",
    "matplotlib>=3.7,<4.0",
]

[project.optional-dependencies]
# Dataset stack: targets the lerobot 0.5.1 API for SO-100 datasets.
data = [
    "lerobot==0.5.1",
    "huggingface-hub>=1.0,<2.0",
]
# Simulator stack: transitively brought in via lrm-ch02 if integration
# tests run the full pipeline. Match Sid's Ch 2 pin so envs reconcile.
sim = [
    "mani-skill==3.0.1",
]
# Developer tooling.
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "ruff",
    "jupyter",
    "nbconvert",
    "nbstripout",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

# The one real Chapter 2 sample (two camera PNGs + state/instruction)
# ships inside the package so load_sample() works from a pip install.
[tool.setuptools.package-data]
ch03 = ["assets/*.png", "assets/*.json"]

[tool.ruff]
line-length = 76
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests requiring full pipeline (HuggingFace model downloads, lerobot dataloader). Deselect with -m 'not integration'.",
    "slow: tests that take >10s (e.g., real SigLIP forward pass on CPU).",
]
